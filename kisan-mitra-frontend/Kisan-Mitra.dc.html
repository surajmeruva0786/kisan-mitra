</head>
<body>
<x-dc>

<helmet>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&family=Noto+Sans+Gurmukhi:wght@400;500;600;700&family=Noto+Sans+Oriya:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap");
    * { box-sizing: border-box; }
    body { margin: 0; }
    @keyframes kmBlobA { 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(30px,-40px) scale(1.08);} }
    @keyframes kmBlobB { 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(-24px,30px) scale(1.05);} }
  </style>
</helmet>
<div style="--fs-mult:{{ fontScaleMultiplier }}; font-family:'DM Sans','Noto Sans Telugu','Noto Sans Devanagari','Noto Sans Tamil','Noto Sans Kannada','Noto Sans Bengali','Noto Sans Gujarati','Noto Sans Gurmukhi','Noto Sans Oriya','Noto Sans Malayalam','Noto Sans Arabic',sans-serif; min-height:100vh; background:#FAFAFB; position:relative; color:#1A1625;">

  <div style="position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0;">
    <div style="position:absolute; width:520px; height:520px; border-radius:999px; background:#7C3AED; opacity:0.10; filter:blur(90px); top:-140px; left:-120px; animation:kmBlobA 16s ease-in-out infinite;"></div>
    <div style="position:absolute; width:460px; height:460px; border-radius:999px; background:#4F46E5; opacity:0.09; filter:blur(90px); bottom:-120px; right:-100px; animation:kmBlobB 18s ease-in-out infinite;"></div>
  </div>

  <div style="position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; padding:14px 28px; border-bottom:1px solid rgba(0,0,0,0.06); background:rgba(255,255,255,0.7); backdrop-filter:blur(12px);">
    <div style="display:flex; align-items:center; gap:10px;">
      <svg width="26" height="26" viewBox="0 0 64 64" fill="none">
        <g transform="translate(32, 32)">
          <circle cx="0" cy="0" r="26" stroke="#7C3AED" stroke-width="4.5" fill="none"></circle>
          <path d="M-22,-18 A34,34 0 0,1 22,-18" stroke="url(#topM)" stroke-width="4" stroke-linecap="round" fill="none"></path>
          <circle cx="0" cy="0" r="4.5" fill="#7C3AED"></circle>
        </g>
        <defs><linearGradient id="topM" x1="10" y1="14" x2="54" y2="14"><stop offset="0%" stop-color="#A78BFA"></stop><stop offset="100%" stop-color="#6D28D9"></stop></linearGradient></defs>
      </svg>
      <span style="font-family:'Instrument Sans',sans-serif; font-weight:700; font-size:15px; color:#1A1625;">Kisan-Mitra</span>
      <span style="font-size:12px; color:#9CA3AF; font-weight:500;">Prototype Preview</span>
    </div>
    <div style="display:flex; align-items:center; gap:2px; background:#F3F4F6; padding:3px; border-radius:999px;">
      <button onClick="{{ setDesktopMode }}" style="{{ desktopToggleStyle }}">Desktop</button>
      <button onClick="{{ setMobileMode }}" style="{{ mobileToggleStyle }}">Mobile</button>
    </div>
  </div>

  <div style="position:relative; z-index:1;">
    <sc-if value="{{ isDesktopMode }}" hint-placeholder-val="{{ true }}">
      <sc-if value="{{ isOnboarding }}" hint-placeholder-val="{{ true }}">
        <dc-import name="Onboarding" data="{{ obData }}" actions="{{ obActions }}" is-desktop="{{ true }}" hint-size="100%,760"></dc-import>
      </sc-if>
      <sc-if value="{{ isNotOnboarding }}" hint-placeholder-val="{{ false }}">
        <dc-import name="AppShell" data="{{ shellData }}" actions="{{ shellActions }}" is-desktop="{{ true }}" is-mobile="{{ false }}" hint-size="100%,860"></dc-import>
      </sc-if>
    </sc-if>
    <sc-if value="{{ isMobileMode }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex; justify-content:center; padding:36px 16px 60px;">
        <x-import component-from-global-scope="AndroidDevice" from="./android-frame.jsx" width="{{ 412 }}" height="{{ 892 }}" hint-size="412,892">
          <sc-if value="{{ isOnboarding }}" hint-placeholder-val="{{ true }}">
            <dc-import name="Onboarding" data="{{ obData }}" actions="{{ obActions }}" is-desktop="{{ false }}" hint-size="380,780"></dc-import>
          </sc-if>
          <sc-if value="{{ isNotOnboarding }}" hint-placeholder-val="{{ false }}">
            <dc-import name="AppShell" data="{{ shellData }}" actions="{{ shellActions }}" is-desktop="{{ false }}" is-mobile="{{ true }}" hint-size="380,780"></dc-import>
          </sc-if>
        </x-import>
      </div>
    </sc-if>
  </div>
</div>

</x-dc>

  t(key) {
    const lang = this.state.language;
    return (UI[lang] && UI[lang][key]) || (NAV_FALLBACK[lang] && NAV_FALLBACK[lang][key]) || UI.en[key] || '';
  }
  localized(obj) {
    if (!obj) return '';
    const lang = this.state.language;
    return obj[lang] || obj.en;
  }

  getBotReply(rawMsg) {
    const msg = rawMsg.toLowerCase();
    const script = CHAT_SCRIPT[this.state.language] || CHAT_SCRIPT.en;
    const scriptEn = CHAT_SCRIPT.en;
    const pick = (key) => script[key] || scriptEn[key];
    if (/weather|rain|climate|వాతావర|मौसम/.test(msg)) return pick('weather').a;
    if (/price|rate|cotton|mandi|ధర|भाव|कीमत/.test(msg)) return pick('prices').a;
    if (/scheme|yojana|kisan|eligib|పథక|योजना/.test(msg)) return pick('schemes').a;
    if (/sow|calendar|plant|crop|పంట|कैलेंडर|बुवाई/.test(msg)) return pick('calendar').a;
    if (/pest|disease|yellow|bug|పురుగు|कीट|पीली/.test(msg)) return pick('pest').a;
    return {type:'text', text: script.fallback || scriptEn.fallback};
  }

  sendMessage(rawText, presetReply) {
    const text = (rawText !== undefined ? rawText : this.state.chat.draft).trim();
    if (!text) return;
    const userMsg = {id:uid(), from:'user', type:'text', text};
    this.setState(s => ({chat:{...s.chat, messages:[...s.chat.messages, userMsg], draft:'', typing:true}}));
    const reply = presetReply || this.getBotReply(text);
    setTimeout(() => {
      this.setState(s => ({chat:{...s.chat, typing:false, messages:[...s.chat.messages, {id:uid(), from:'bot', ...reply}]}}));
    }, 650);
  }

  toggleMic() {
    if (this.state.chat.listening) { if (this.recognition) this.recognition.stop(); this.setState(s=>({chat:{...s.chat, listening:false}})); return; }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('Voice input is not supported in this browser.'); return; }
    const rec = new SR();
    rec.lang = SPEECH_LANG[this.state.language] || 'en-IN';
    rec.interimResults = true;
    rec.continuous = false;
    rec.onresult = (e) => {
      let transcript = '';
      for (let i=0;i<e.results.length;i++) transcript += e.results[i][0].transcript;
      const isFinal = e.results[e.results.length-1].isFinal;
      this.setState(s => ({chat:{...s.chat, draft: transcript, listening: !isFinal}}));
    };
    rec.onend = () => this.setState(s => ({chat:{...s.chat, listening:false}}));
    rec.onerror = () => this.setState(s => ({chat:{...s.chat, listening:false}}));
    this.recognition = rec;
    this.setState(s => ({chat:{...s.chat, listening:true}}));
    try { rec.start(); } catch(e) {}

        onEditProfile: () => this.setState({onboardingReturnTo:'settings', onboardingStep:2, screen:'onboarding'}),
        languages: settingsLanguages, textSizeOptions, isHighContrast: st.profile.highContrast, onToggleHighContrast: () => this.setState(s=>({profile:{...s.profile, highContrast:!s.profile.highContrast}})),
        isVoiceAssist: st.profile.voiceAssist, onToggleVoiceAssist: () => this.setState(s=>({profile:{...s.profile, voiceAssist:!s.profile.voiceAssist}})),
        notifications: notificationsList.map(n => ({...n, trackBg: n.isOn?'#7C3AED':'#E5E7EB', knobLeft: n.isOn?'22px':'2px'})), helpline:'1800-180-1551',
        highContrastTrackBg: st.profile.highContrast ? '#7C3AED' : '#E5E7EB', highContrastKnobLeft: st.profile.highContrast ? '22px' : '2px',
        voiceAssistTrackBg: st.profile.voiceAssist ? '#7C3AED' : '#E5E7EB', voiceAssistKnobLeft: st.profile.voiceAssist ? '22px' : '2px',
        onReplayOnboarding: () => this.setState({onboardingReturnTo:'chat', onboardingStep:0, screen:'onboarding'}) },
    };
    const shellActions = {};

    return {
      fontScaleMultiplier, isDesktopMode, isMobileMode: !isDesktopMode, isOnboarding, isNotOnboarding: !isOnboarding,
      desktopToggleStyle: `border:none;padding:7px 16px;border-radius:999px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;background:${isDesktopMode?'#7C3AED':'transparent'};color:${isDesktopMode?'#fff':'#6B7280'};`,
      mobileToggleStyle: `border:none;padding:7px 16px;border-radius:999px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;background:${!isDesktopMode?'#7C3AED':'transparent'};color:${!isDesktopMode?'#fff':'#6B7280'};`,
      setDesktopMode: () => this.setState({viewMode:'desktop'}),
      setMobileMode: () => this.setState({viewMode:'mobile'}),
      obData, obActions, shellData, shellActions,
    };
  }
}

</script>
</body>
